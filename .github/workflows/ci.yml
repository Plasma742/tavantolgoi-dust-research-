name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
# No deployment job by design: nothing is published from CI before scientific review.
# These are software checks. Passing CI is NOT scientific validation and NOT Earth Engine parity
# evidence; the live acceptance test (api/tests/test_ee_acceptance.py) is opt-in and never runs here.
jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Starter contract tests (static, not EE validation)
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: GEE script syntax
        run: |
          node --check gee/maiac_smoke_test.js
          node --check gee/maiac_parity_check.js
      - name: Parity script behaviour vs shared truth table (fake EE, offline)
        run: node --test "gee/tests/*.test.mjs"
      - name: Secret guard
        run: |
          if git ls-files | grep -Ei '(service-account|credentials).*\.json$|\.pem$|\.p12$|(^|/)\.env$'; then
            echo "Credential-like file tracked in git"; exit 1; fi
          if git grep -nE 'BEGIN (RSA |EC )?PRIVATE KEY|"private_key_id"|AIza[0-9A-Za-z_-]{35}' -- . ':!.github/workflows/ci.yml'; then
            echo "Credential-like content found"; exit 1; fi

  api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: api/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - name: Generated method artifacts are current
        run: python -m scripts.generate_method_artifacts --check
      - run: ruff check .
      - run: ruff format --check .
      - name: Unit and offline parity tests (live Earth Engine tests are skipped)
        run: python -m pytest

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Bundle must not contain credentials or Earth Engine URLs
        run: |
          if grep -rEl 'earthengine\.googleapis\.com|private_key|BEGIN PRIVATE KEY' dist; then exit 1; fi
